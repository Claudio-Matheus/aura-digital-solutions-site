<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente de Fundo do Card -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162238"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>

    <!-- Gradiente Dourado Premium da Logo -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>

    <!-- Marca D'água da Seta de Crescimento no Fundo -->
    <linearGradient id="watermarkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f304f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2a426c" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- Base com Cantos Arredondados do App Icon -->
  <rect width="512" height="512" rx="105" fill="url(#cardGrad)"/>

  <!-- Seta de Fundo (Gráfico de Crescimento) -->
  <g fill="url(#watermarkGrad)">
    <path d="M 115 375 L 335 155 L 375 195 L 155 415 Z"/>
    <polygon points="290,125 415,125 415,250 365,200 340,175"/>
  </g>

  <!-- Símbolo Principal: "C" Geométrico Perfeito -->
  <path d="
    M 375.5 136
    A 138 138 0 1 0 375.5 274
    L 320.1 242
    A 74 74 0 1 1 320.1 168
    Z" 
    fill="url(#goldGrad)" />

  <!-- Gráfico de Barras Interno (3 Barras com Toque Arredondado) -->
  <g fill="url(#goldGrad)">
    <!-- Barra 1 (Pequena - Esquerda) -->
    <rect x="215" y="225" width="22" height="42" rx="3"/>
    <!-- Barra 2 (Média - Centro) -->
    <rect x="245" y="188" width="22" height="79" rx="3"/>
    <!-- Barra 3 (Alta - Direita) -->
    <rect x="275" y="151" width="22" height="116" rx="3"/>
  </g>

  <!-- Nome da Marca "Clarus" -->
  <text x="256" y="422" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="1">Clarus</text>
</svg>
